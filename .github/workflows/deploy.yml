# Publica la app en GitHub Pages en cada push a main.
# Necesita en Settings → Secrets and variables → Actions:
#   SUPABASE_URL              (ej. https://xxxx.supabase.co)
#   SUPABASE_PUBLISHABLE_KEY  (sb_publishable_...; es pública, protegida por RLS)
# Sin esos secrets la app se publica en "modo demo".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pruebas del clasificador
        run: node --test pruebas/*.test.mjs

      - name: Armar la carpeta del sitio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir _site
          cp -r index.html manifest.json sw.js css js icons _site/
          rm -f _site/js/config.js
          # config.js se crea aquí con los secrets (nunca está en el repositorio)
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            node -e '
              const c = { SUPABASE_URL: process.env.SUPABASE_URL, SUPABASE_ANON_KEY: process.env.SUPABASE_PUBLISHABLE_KEY, FUNCION_IA: "procesar" };
              require("fs").writeFileSync("_site/js/config.js", "export const CONFIG = " + JSON.stringify(c, null, 2) + ";\n");
            '
            echo "config.js creado"
          else
            echo "::warning::Faltan los secrets de Supabase: se publica en modo demo"
          fi
          # Versión nueva del service worker en cada publicación
          sed -i "s/const VERSION = 'rh-v1'/const VERSION = 'rh-${GITHUB_SHA::8}'/" _site/sw.js
          grep "const VERSION" _site/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: despliegue
        uses: actions/deploy-pages@v4
