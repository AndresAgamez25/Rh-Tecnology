<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover permite usar toda la pantalla del iPhone (con notch) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Lista de productos faltantes de RH TECNOLOGY, Corozal (Sucre).">
  <meta name="theme-color" content="#070d1c">
  <meta name="color-scheme" content="dark">
  <title>RH Faltantes</title>

  <!-- PWA: instalable en Android y en iPhone ("Agregar a pantalla de inicio") -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/logo-rh.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RH Faltantes">
  <!-- Barra de estado transparente: el contenido llega hasta arriba (por eso usamos safe-area) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-vista="cargando" data-modo="lista">
  <!-- ───────── Pantalla de carga ───────── -->
  <div class="vista vista-cargando" aria-label="Cargando">
    <img src="icons/logo.webp" alt="" class="cargando-logo" width="180" height="126">
  </div>

  <!-- ───────── Pantalla de login ───────── -->
  <section class="vista vista-login" aria-labelledby="login-titulo">
    <form id="form-login" class="login-caja" novalidate>
      <img src="icons/logo.webp" alt="" class="login-logo" width="216" height="152">
      <h1 id="login-titulo" class="solo-lectores">RH TECNOLOGY</h1>
      <p class="login-sub">Lista de faltantes · Corozal, Sucre</p>

      <label class="campo">
        <span>Correo</span>
        <input type="email" id="login-email" autocomplete="username" inputmode="email"
               autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="campo">
        <span>Contraseña</span>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </label>

      <p id="login-error" class="login-error" role="alert"></p>
      <button type="submit" id="btn-login" class="btn btn-principal">Entrar</button>
    </form>
  </section>

  <!-- ───────── App ───────── -->
  <div class="vista vista-app">
  <!-- ───────── Encabezado (lista) ───────── -->
  <header class="encabezado encabezado-lista">
    <div class="marca">
      <img src="icons/logo-rh.svg" alt="" class="marca-img" width="46" height="29">
      <div>
        <h1 class="marca-nombre">RH <span class="marca-celeste">TECNOLOGY</span></h1>
        <p class="marca-sub">
          <span id="usuario-nombre">Corozal, Sucre</span>
          <button type="button" id="btn-salir" class="btn-enlace" hidden>· Salir</button>
        </p>
      </div>
    </div>
    <div class="encabezado-acciones">
      <button type="button" id="btn-facturas" class="btn-icono btn-facturas" aria-label="Facturas de compras" title="Facturas de compras">🧾</button>
      <button type="button" id="btn-reiniciar" class="btn btn-peligro-suave">Reiniciar lista</button>
    </div>
  </header>

  <!-- ───────── Encabezado (modo compras) ───────── -->
  <header class="encabezado encabezado-compras">
    <div class="compras-titulo">
      <h1 class="marca-nombre">🛒 Modo compras</h1>
      <p class="marca-sub" id="compras-progreso" aria-live="polite"></p>
    </div>
    <button type="button" id="btn-salir-compras" class="btn btn-secundario">Salir</button>
    <div class="progreso" aria-hidden="true"><div class="progreso-barra" id="compras-barra"></div></div>
  </header>

  <!-- ───────── Encabezado (facturas) ───────── -->
  <header class="encabezado encabezado-facturas">
    <div class="compras-titulo">
      <h1 class="marca-nombre">🧾 Facturas de compras</h1>
      <p class="marca-sub">Historial de cada salida de compras</p>
    </div>
    <button type="button" id="btn-volver" class="btn btn-secundario">Volver</button>
  </header>

  <!-- ───────── Pestañas de categorías (se llenan desde JS) ───────── -->
  <nav class="pestanas" id="pestanas" role="tablist" aria-label="Categorías"></nav>

  <!-- ───────── Lista de faltantes ───────── -->
  <main id="lista" class="lista" role="tabpanel" aria-live="polite"></main>

  <!-- ───────── Barra inferior para enviar ───────── -->
  <form id="barra" class="barra" autocomplete="off">
    <button type="button" id="btn-audio" class="btn-icono" aria-label="Grabar audio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
    </button>

    <!-- El input de archivo va oculto; el <label> funciona como botón -->
    <button type="button" id="btn-cancelar-audio" class="btn-icono btn-cancelar" aria-label="Cancelar audio" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
    </button>

    <label class="btn-icono" for="input-foto" id="btn-foto" aria-label="Tomar foto">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3 7.17 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.17L15 3H9Zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg>
    </label>
    <input type="file" id="input-foto" accept="image/*" capture="environment" hidden>

    <label for="texto" class="solo-lectores">¿Qué falta?</label>
    <textarea id="texto" class="barra-texto" rows="1" enterkeyhint="send"
              placeholder="¿Qué falta?"></textarea>

    <button type="submit" id="btn-enviar" class="btn-icono btn-enviar" aria-label="Enviar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
    </button>
  </form>
  </div>

  <!-- ───────── Barra inferior del Modo compras ───────── -->
  <div class="barra-compras">
    <span id="compras-resumen" class="barra-compras-texto" aria-live="polite"></span>
    <button type="button" id="btn-terminar-compra" class="btn btn-exito">Terminar compra</button>
  </div>

  <!-- ───────── Modal de confirmación propio (no usamos confirm()) ───────── -->
  <dialog id="modal" class="modal" aria-labelledby="modal-titulo" aria-describedby="modal-mensaje">
    <form method="dialog" class="modal-caja">
      <h2 id="modal-titulo" class="modal-titulo"></h2>
      <p id="modal-mensaje" class="modal-mensaje"></p>
      <div class="modal-botones">
        <button value="cancelar" class="btn btn-secundario" autofocus>Cancelar</button>
        <button value="aceptar" class="btn btn-peligro" id="modal-aceptar">Aceptar</button>
      </div>
    </form>
  </dialog>

  <!-- Mensajes cortos (toasts). aria-live hace que los lectores de pantalla los lean -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
